<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
 <rect width="960" height="540" fill="#F7F9FC"/><rect x="0" width="16" height="540" fill="#0B5CAB"/>
 <text x="72" y="78" font-family="Arial" font-size="30" font-weight="700" fill="#102A43">Motivation and research questions</text>
 <text x="72" y="116" font-family="Arial" font-size="16" fill="#486581">Manual review cannot scale to thousands of annual reports. We rank firm-years for review priority.</text>
 <g font-family="Arial"><rect x="72" y="160" width="250" height="246" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/><circle cx="116" cy="210" r="24" fill="#0B5CAB"/><text x="116" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">01</text><text x="104" y="264" font-size="20" font-weight="700" fill="#102A43">Incremental value</text><text x="104" y="302" font-size="15" fill="#486581">Does MD&amp;A text add</text><text x="104" y="326" font-size="15" fill="#486581">value beyond financial</text><text x="104" y="350" font-size="15" fill="#486581">features?</text>
 <rect x="355" y="160" width="250" height="246" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/><circle cx="399" cy="210" r="24" fill="#2D8C7A"/><text x="399" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">02</text><text x="387" y="264" font-size="20" font-weight="700" fill="#102A43">Contribution</text><text x="387" y="302" font-size="15" fill="#486581">Which feature group</text><text x="387" y="326" font-size="15" fill="#486581">drives the review</text><text x="387" y="350" font-size="15" fill="#486581">ranking?</text>
 <rect x="638" y="160" width="250" height="246" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/><circle cx="682" cy="210" r="24" fill="#F59E0B"/><text x="682" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">03</text><text x="670" y="264" font-size="20" font-weight="700" fill="#102A43">Stability</text><text x="670" y="302" font-size="15" fill="#486581">Is the ranking stable</text><text x="670" y="326" font-size="15" fill="#486581">across models and</text><text x="670" y="350" font-size="15" fill="#486581">thresholds?</text></g>
